<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剪贴板管家</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <input id="search" type="text" placeholder="搜索剪贴板记录..." autocomplete="off" />
        <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
      </header>

      <div id="list" class="clip-list"></div>
      <div id="empty" class="empty">暂无记录，复制点什么试试 (Ctrl+C)</div>

      <footer class="footer">
        <div class="del-group">
          <span class="del-label">删除:</span>
          <button data-range="1h">最近1小时</button>
          <button data-range="today">今天</button>
          <button data-range="7d">最近7天</button>
          <button data-range="30d">最近30天</button>
          <button data-range="all" class="danger">清空全部</button>
        </div>
        <div class="hint" id="hint"></div>
      </footer>
    </div>
  </body>
</html>
