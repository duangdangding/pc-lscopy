<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剪贴板管家</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="toolbar">
        <label class="record-switch" title="关闭后不存储复制的内容">
          <input type="checkbox" id="toggle-enabled" checked />
          <span>开启记录</span>
        </label>
        <input id="search" type="text" placeholder="搜索剪贴板记录..." autocomplete="off" />
        <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
      </header>

      <nav class="tabs main-tabs" id="tabs">
        <button class="tab active" data-tab="all">全部</button>
        <button class="tab" data-tab="image">图片</button>
        <button class="tab" data-tab="video">视频</button>
        <button class="tab" data-tab="text">文字</button>
        <button class="tab" data-tab="office">办公</button>
        <button class="tab" data-tab="other">其他</button>
      </nav>

      <div id="list" class="clip-list"></div>
      <div id="empty" class="empty">暂无记录，复制点什么试试 (Ctrl+C)</div>

      <footer class="footer">
        <div class="hint" id="hint"></div>
      </footer>
    </div>
  </body>
</html>
